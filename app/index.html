us siete acordes y qué papel cumple cada uno."},circle:{title:"Círculo de quintas",body:"Las doce tonalidades, cada una a una quinta de la anterior. De una a la de al lado cambia una sola nota. El número de afuera es cuántos sostenidos (#) o bemoles (b) lleva.",example:"De C a G: F pasa a F#."},keySignature:{title:"Armadura",body:"Los sostenidos o bemoles que la tonalidad lleva siempre. En una partitura se escriben una sola vez, al principio."},keyNotes:{title:"Las notas de la tonalidad",body:"Las siete notas de su escala. De ahí salen todos sus acordes y sus melodías. El número de abajo es el grado: el lugar de la nota en la escala."},relativeKey:{title:"Relativa",body:"La tonalidad menor (o mayor) que usa exactamente las mismas notas, con otro centro.",example:"C mayor y A menor."},neighbourKeys:{title:"Vecinas",body:"Las de al lado en el círculo: comparten seis de las siete notas. Son los cambios de tonalidad más suaves, y de ahí vienen casi todos los acordes “prestados”."},diatonic:{title:"Los acordes de la tonalidad",body:"Salen de la escala: desde cada nota, esa nota y una sí, una no hacia arriba. Como comparten las mismas siete notas, suenan bien juntos.",example:"C mayor: C · Dm · Em · F · G · Am · Bdim"},"keyChords:triad":{title:"Tríadas",body:"Los acordes de tres notas: la versión básica de cada uno."},"keyChords:sixth":{title:"Sextas",body:"El acorde con la sexta en lugar de la séptima. Lo toman solo algunos grados de cada tonalidad; los demás quedan con séptima."},"keyChords:seventh":{title:"Séptimas",body:"Los mismos siete acordes con una nota más de la escala. Suenan más ricos; son la base del jazz, el soul y la bossa."},"keyChords:ninth":{title:"Novenas",body:"La séptima y una nota más arriba: la novena. Donde esa nota choca con el acorde, el grado queda con séptima."},"keyChords:eleventh":{title:"Oncenas",body:"Hasta la oncena. Es donde más cambian los acordes: el dominante pierde la tercera y queda suspendido, y solo un acorde mayor la admite."},"keyChords:thirteenth":{title:"Trecenas",body:"La séptima más la trecena, que es la sexta una octava arriba. El acorde más lleno que da la tonalidad."},numeral:{title:"Grado, en números romanos",body:"El lugar del acorde en la tonalidad. Mayúscula es mayor, minúscula es menor, ° es disminuido. Sirve para pensar una progresión en cualquier tonalidad.",example:"I–V–vi–IV en C: C G Am F. En G: G D Em C."},"fn:tonic":{title:"Reposo (tónica)",body:"Acordes donde la música descansa. Una canción suele empezar y terminar en uno de estos."},"fn:subdominant":{title:"Salida (subdominante)",body:"Acordes que se alejan del centro sin apuro por volver. Suelen preparar la tensión."},"fn:dominant":{title:"Tensión (dominante)",body:"Acordes inestables: piden resolver en uno de reposo."},keyToChords:{title:"Ver en Acordes",body:"Abre este acorde en Acordes: todas sus formas en el mástil, sus inversiones y su arpegio."},keyToScales:{title:"Ver en el mástil",body:"Abre Escalas con la escala de esta tonalidad en todo el mástil y las notas del acorde elegido resaltadas."},instrument:{title:"Sonido",body:"La guitarra con la que suena todo: criolla o eléctrica con overdrive. Al cambiarla, toca un C."},theme:{title:"Tema",body:"Claro u oscuro. Hasta que lo cambies, sigue el de tu dispositivo."},caged:{title:"CAGED",body:"Las cinco formas de acorde abierto —C, A, G, E y D— corridas por el mástil con cejilla. Con esas cinco se toca cualquier acorde en cualquier zona.",example:"La forma de E en el traste 8 da un C."},drop2:{title:"Drop-2",body:"Las cuatro notas del acorde lo más juntas posible, con la segunda desde arriba bajada una octava. Suele quedar en cuatro cuerdas seguidas; es la forma típica de acompañar en jazz.",example:"Cmaj7 drop-2: x-3-5-4-5-x"},drop3:{title:"Drop-3",body:"Como el drop-2, pero baja la tercera nota desde arriba. Queda una cuerda sin tocar entre el bajo y las otras tres.",example:"Cmaj7 drop-3: 8-x-9-9-8-x"},shell:{title:"Shell",body:"Raíz, tercera y séptima, sin la quinta. Lo mínimo que dice qué acorde es."},"fam:major":{title:"Mayores",body:"Acordes con tercera mayor que suenan a reposo: el mayor común y sus variantes con más color.",example:"A · A6 · Amaj7 · Amaj9"},"fam:minor":{title:"Menores",body:"Acordes con tercera menor, de sonido más oscuro: el menor común y sus variantes.",example:"Am · Am7 · Am9 · AmMaj7"},"fam:dominant":{title:"Séptimas",body:"Acordes mayores con séptima menor, los “dominantes”. Suenan a que algo tiene que seguir: A7 quiere caer en D.",example:"A7 · A9 · A13"},"fam:altered":{title:"Séptimas alteradas",body:"Séptimas con la quinta o la novena corridas medio tono. Tensas a propósito: van justo antes de un acorde estable.",example:"A7#9 es el “acorde Hendrix”."},"fam:dimaug":{title:"Disminuidos y aumentados",body:"Acordes con la quinta bajada (disminuidos) o subida (aumentados). Inestables; casi siempre de paso.",example:"Adim7 · Am7b5 · Aaug"},"fam:sus":{title:"Suspendidos",body:"Sin tercera: en su lugar va la segunda (sus2) o la cuarta (sus4). Ni mayores ni menores.",example:"Asus4 → A es el gesto clásico."},chordTypes:{title:"Tipo de acorde",body:"Qué acorde se arma sobre la raíz: primero la familia, después el acorde. Toca de nuevo el que está marcado para sacarlo."},showAll:{title:"Ver todos en el mástil",body:"Dibuja una forma por zona a lo largo de todo el mástil, cada una de un color."},inversion:{title:"Inversiones",body:"El mismo acorde, con las mismas notas, pero con otra de ellas como la más grave. Cambia cómo suena, no qué acorde es.",example:"C, C/E y C/G son los tres el acorde de C."},position:{title:"Traste",body:"En qué traste arranca la forma. El mismo acorde se toca en varias zonas: hacia el cuerpo suena más agudo."},alts:{title:"Nombres alternativos",body:"Las mismas notas leídas desde otra raíz dan otro acorde. El nombre grande es la lectura más probable.",example:"C6 y Am7 tienen las mismas cuatro notas."},notesDegrees:{title:"Notas y grados",body:"Arriba el nombre de cada nota; abajo su grado, el lugar que ocupa contando desde la raíz.",example:"En C7: C es 1, E es 3, G es 5 y Bb es b7."},structure:{title:"Estructura",body:"Los grados que forman el acorde. Es la misma para todos los acordes de ese tipo, sea cual sea la raíz."},analysis:{title:"Análisis",body:"Lo particular de esta forma: bajo distinto de la raíz, notas que faltan o sobran, otros nombres posibles."},play:{title:"Reproducir",body:"Hace sonar el acorde como un rasgueo."},arpeggio:{title:"Arpegio",body:"Hace sonar las mismas notas de a una, de la cuerda más grave a la más aguda."},stack:{title:"Apilar",body:"Encendido, cada forma que eliges se suma al mástil con su color en vez de reemplazar a la anterior. Sirve para comparar formas.",example:"Hasta 5 a la vez."},clearLayers:{title:"Limpiar capas",body:"Saca las formas apiladas. La elegida queda."},share:{title:"Compartir",body:"Copia un link a esta misma forma y afinación."},seeAllShapes:{title:"Ver todas las formas",body:"Lleva este acorde a la pantalla Acordes."},"arp:what":{title:"Arpegio",body:"Las notas de un acorde tocadas de a una, en vez de todas juntas."},"arp:show":{title:"Verlo en el mástil",body:"Dibuja todos los lugares del mástil donde están las notas del acorde."},"arp:practice":{title:"Practicarlo a tempo",body:"Abre Practicar con este arpegio."},ownScale:{title:"La escala del acorde",body:"La escala que tiene todas las notas del acorde, más las de paso entre una y otra."},otherScales:{title:"Otras escalas",body:"También suenan bien sobre este acorde; cada una le da otro color."},goesWith:{title:"Escalas que van con el acorde",body:"Las que suenan bien sobre el acorde elegido. La primera tiene todas sus notas."},highlight:{title:"Resaltar las notas del acorde",body:"Dibuja más grandes las notas de la escala que son del acorde: ahí conviene caer mientras suena."},"tr:level":{title:"Nivel",body:"Del 1 al 5 la zona se agranda: una cuerda, dos, una posición, todo el mástil. Pasas con 10 seguidas o 90% de las últimas 20."},"tr:mode":{title:"Cómo preguntar",body:"Nombrar: te marca un traste y dices qué nota es. Buscar: te dice una nota y marcas dónde está."},"tr:name":{title:"Nombrar",body:"Se marca un traste y eliges qué nota es. C# y Db cuentan igual: son la misma nota."},"tr:find":{title:"Buscar",body:"Te pide una nota y marcas todos los lugares de la zona donde está."},"tr:stats":{title:"Cómo vas",body:"Racha: aciertos seguidos. Aciertos y tiempo: de tus últimas 20 respuestas en este nivel. Se guarda solo en este navegador."},"pr:kind:notes":{title:"Entrenador",body:"Notas, intervalos, tríadas y acordes en el mástil, por niveles: nombra lo que ves o busca dónde está."},"tr:subject":{title:"Qué entrenar",body:"Cada cosa tiene sus niveles y guarda tu progreso por separado."},"tr:subject:notes":{title:"Notas",body:"Qué nota hay en cada traste: de una cuerda a todo el mástil."},"tr:subject:intervals":{title:"Intervalos",body:"La distancia entre dos notas, como forma en dos cuerdas: de las 3ras y la 5ta a los doce.",example:"De C a G: 5ta justa, 7 semitonos"},"tr:subject:triads":{title:"Tríadas",body:"Acordes de tres notas en tres cuerdas vecinas: mayor, menor, disminuida, aumentada y sus, también invertidas."},"tr:subject:sevenths":{title:"Acordes",body:"Acordes de cuatro notas en cuatro cuerdas vecinas: maj7, 7, m7, m7b5, dim7, y después 6, m6 y m(maj7)."},"dr:name":{title:"Nombrar",body:"Se dibuja una forma en el mástil y eliges qué es. Al responder, cada nota muestra su nombre o su grado."},"dr:find":{title:"Buscar",body:"Te dice un intervalo o un acorde y marcas todos los lugares de la zona donde están sus notas."},practiceScale:{title:"Practicar esta escala",body:"Abre Practicar con esta escala."},cmp:{title:"Comparar",body:"Cada escala es otra que ya conoces con alguna nota cambiada. Aquí ves cuál, y la escala junto a sus parientes.",example:"Dórica = Menor con 6"},prog:{title:"Progresiones",body:"Acordes escritos por grado (I, V, vi…), así se arman solos en cualquier tonalidad. Elige una tonalidad en el círculo: si es menor, ves las progresiones en menor, todas desde su acorde.",example:"I V vi IV: en C, C G Am F; en G, G D Em C"},"prog:neck":{title:"Todo el mástil",body:"Las notas del acorde que suena, en los trastes 0 a 12, con su grado. Las punteadas son del acorde que viene."},"prog:box":{title:"Una posición",body:"Solo cinco trastes, para practicar sin mover la mano. Las flechas corren la ventana."},why:{title:"¿Por qué suena así?",body:"La razón detrás del nombre, en el mástil y con sonido: qué nota separa mayor de menor, y cómo suena cada distancia entre dos notas."},"why:consonance":{title:"Consonante y disonante",body:"Cómo usa la música occidental cada intervalo: si puede quedarse quieto o suele pedir moverse. Es una costumbre de esa tradición, no una ley."},"why:dominant":{title:"El V7 y su tritono",body:"El acorde 7 sobre el quinto grado tiene dos notas a 6 semitonos. Cada una se mueve un paso corto y caen en el acorde de la tónica.",example:"G7 → C: B sube a C, F baja a E"},"cmp:none":{title:"Esta sola",body:"Solo la escala elegida y la escala conocida de la que sale."},"cmp:parallel":{title:"Paralelos",body:"Los siete modos sobre la misma raíz, del más brillante al más oscuro. Cambian las notas; la casa es la misma.",example:"C Lidia, C Jónica, C Mixolidia…"},"cmp:relative":{title:"Relativos",body:"Las escalas que usan exactamente estas notas pero empiezan en otra. Las notas son las mismas; cambia cuál es la casa.",example:"C Jónica = D Dórica = A Eólica"},view:{title:"Qué muestra el mástil",body:"La forma elegida, o todos los lugares donde hay una nota del acorde."},"view:chord":{title:"La forma",body:"Solo la digitación elegida: dónde va cada dedo."},"view:arp":{title:"Arpegio",body:"Todos los lugares del mástil donde hay una nota del acorde, para tocarlas de a una."},display:{title:"Mostrar",body:"Qué se escribe en cada punto: el nombre de la nota o su grado."},"show:note":{title:"Notas",body:"Cada punto lleva el no
