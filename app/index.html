a",body:"Claro u oscuro. Hasta que lo cambies, sigue el de tu dispositivo."},caged:{title:"CAGED",body:"Las cinco formas de acorde abierto —C, A, G, E y D— corridas por el mástil con cejilla. Con esas cinco se toca cualquier acorde en cualquier zona.",example:"La forma de E en el traste 8 da un C."},drop2:{title:"Drop-2",body:"Las cuatro notas del acorde lo más juntas posible, con la segunda desde arriba bajada una octava. Suele quedar en cuatro cuerdas seguidas; es la forma típica de acompañar en jazz.",example:"Cmaj7 drop-2: x-3-5-4-5-x"},drop3:{title:"Drop-3",body:"Como el drop-2, pero baja la tercera nota desde arriba. Queda una cuerda sin tocar entre el bajo y las otras tres.",example:"Cmaj7 drop-3: 8-x-9-9-8-x"},shell:{title:"Shell",body:"Raíz, tercera y séptima, sin la quinta. Lo mínimo que dice qué acorde es."},"fam:major":{title:"Mayores",body:"Acordes con tercera mayor que suenan a reposo: el mayor común y sus variantes con más color.",example:"A · A6 · Amaj7 · Amaj9"},"fam:minor":{title:"Menores",body:"Acordes con tercera menor, de sonido más oscuro: el menor común y sus variantes.",example:"Am · Am7 · Am9 · AmMaj7"},"fam:dominant":{title:"Séptimas",body:"Acordes mayores con séptima menor, los “dominantes”. Suenan a que algo tiene que seguir: A7 quiere caer en D.",example:"A7 · A9 · A13"},"fam:altered":{title:"Séptimas alteradas",body:"Séptimas con la quinta o la novena corridas medio tono. Tensas a propósito: van justo antes de un acorde estable.",example:"A7#9 es el “acorde Hendrix”."},"fam:dimaug":{title:"Disminuidos y aumentados",body:"Acordes con la quinta bajada (disminuidos) o subida (aumentados). Inestables; casi siempre de paso.",example:"Adim7 · Am7b5 · Aaug"},"fam:sus":{title:"Suspendidos",body:"Sin tercera: en su lugar va la segunda (sus2) o la cuarta (sus4). Ni mayores ni menores.",example:"Asus4 → A es el gesto clásico."},chordTypes:{title:"Tipo de acorde",body:"Qué acorde se arma sobre la raíz: primero la familia, después el acorde. Toca de
