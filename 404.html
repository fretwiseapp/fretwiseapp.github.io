<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'none'; base-uri 'self'; form-action 'none'" />
  <title>Esta página no existe · Fretwise</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0B0B0C" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Cg stroke='%233a3a3a' stroke-width='1.5' stroke-linecap='round'%3E%3Cpath d='M16 12v40M32 12v40M48 12v40'/%3E%3C/g%3E%3Ccircle cx='16' cy='42' r='6' fill='%23635BFF'/%3E%3Ccircle cx='32' cy='30' r='6' fill='%23ffffff'/%3E%3Ccircle cx='48' cy='18' r='6' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    /* Rutas absolutas: esta página se sirve en cualquier dirección que no exista, a cualquier profundidad. */
    @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap; src:url('/fonts/inter-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:600; font-display:swap; src:url('/fonts/inter-latin-600-normal.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap; src:url('/fonts/inter-latin-700-normal.woff2') format('woff2'); }
    @font-face { font-family:'Inter'; font-style:italic; font-weight:500; font-display:swap; src:url('/fonts/inter-latin-500-italic.woff2') format('woff2'); }
    :root {
      --bg: #0B0B0C;
      --text: #EDEDED;
      --text-2: rgba(237,237,237,0.62);
      --line: rgba(255,255,255,0.14);
      --accent: #635BFF;
      --fret: #2c2c31;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
      padding-inline: clamp(16px, 4vw, 40px);
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 999px; }
    .top { min-height: 72px; display: flex; align-items: center; }
    .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }
    .brand-wm { font-size: 19px; font-weight: 500; font-style: italic; letter-spacing: -0.01em; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-block: 32px 72px; }
    /* Un traste vacío: la cuerda está, la nota no. */
    .neck { width: min(320px, 100%); height: auto; margin-bottom: 36px; }
    .code { font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-2); }
    h1 { font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 700; line-height: 1.04; letter-spacing: -0.03em; margin: 14px 0 14px; text-wrap: balance; }
    p { color: var(--text-2); max-width: 36ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 52px; padding: 0 26px; border-radius: 999px; font-size: 16px; font-weight: 600; white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 10px 30px -8px rgba(99,91,255,0.55); }
    .btn-ghost { border: 1px solid var(--line); }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.32); }
    @media (max-width: 420px) { .actions .btn { flex: 1 1 100%; } }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="Fretwise, ir al inicio">
      <svg width="26" height="26" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#111111"/>
        <g stroke="#3a3a3a" stroke-width="1.5" stroke-linecap="round"><path d="M16 12v40M32 12v40M48 12v40"/></g>
        <circle cx="16" cy="42" r="6" fill="#635BFF"/><circle cx="32" cy="30" r="6" fill="#fff"/><circle cx="48" cy="18" r="6" fill="#fff"/>
      </svg>
      <span class="brand-wm">fretwise</span>
    </a>
  </header>
  <main>
    <svg class="neck" viewBox="0 0 320 110" aria-hidden="true">
      <g stroke="#2c2c31" stroke-width="1.5"><path d="M20 10v90M110 10v90M210 10v90M300 10v90"/></g>
      <g stroke="#4a4a50" stroke-linecap="round">
        <path d="M10 20h300" stroke-width="0.9"/><path d="M10 34h300" stroke-width="1"/><path d="M10 48h300" stroke-width="1.1"/>
        <path d="M10 62h300" stroke-width="1.3"/><path d="M10 76h300" stroke-width="1.5"/><path d="M10 90h300" stroke-width="1.8"/>
      </g>
      <circle cx="160" cy="55" r="15" fill="none" stroke="#635BFF" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="160" y="61" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#8a84ff">?</text>
    </svg>
    <span class="code">Error 404</span>
    <h1>Esta página no existe</h1>
    <p>Puede que el link esté mal escrito o que la página se haya movido.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Ir al inicio</a>
      <a class="btn btn-ghost" href="/app/">Abrir la app <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
